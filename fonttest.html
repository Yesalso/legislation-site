<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字體診斷 v2</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  body { margin: 0; padding: 14px 12px 40px; background: #fff; color: #111; }
  h1 { font-size: 18px; margin: 0 0 .5rem; }
  h2 { font-size: 15px; margin: 1.3rem 0 .4rem; }
  .meta { font-size: 12px; line-height: 1.5; color: #333; word-break: break-all; }
  .item { border-top: 1px solid #ddd; padding: .5rem 0; }
  .name { font: 700 12px/1.4 ui-monospace, Menlo, monospace; }
  .res { font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #137333; font-weight: 700; }
  .bad { color: #c5221f; font-weight: 700; }
  .warn { color: #b06000; font-weight: 700; }
  .sample { font-size: 24px; line-height: 1.45; margin-top: .2rem; }
  pre { font: 11px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; background: #f4f4f4; padding: .5rem; border-radius: 6px; }
</style>
</head>
<body>
<h1>字體診斷 v2</h1>
<div class="meta" id="ua"></div>

<h2>1. 完整字體：是「下載不到」還是「解不開」</h2>
<div class="item">
  <div class="name">NET　fetch 完整 2.3MB 字體</div>
  <div class="res" id="net">下載中…</div>
</div>
<div class="item">
  <div class="name">DECODE　用 ArrayBuffer 直接建立 FontFace（不經網路）</div>
  <div class="res" id="decode">等 NET 完成…</div>
</div>
<div class="item">
  <div class="name">URL　用 url() 載入完整字體</div>
  <div class="res" id="url">載入中…</div>
</div>

<h2>2. 大小階梯（找出臨界值）</h2>
<div id="ladder"></div>

<h2>3. 站上實際使用（css/theme.css）</h2>
<div class="item">
  <div class="name">MingLiu</div>
  <div class="res" id="site">檢查中…</div>
  <div class="sample" style="font-family:'MingLiu', sans-serif">法規查詢系統：彙整命令</div>
</div>

<h2>4. 原始資料</h2>
<pre id="raw">執行中…</pre>

<script>
const FULL = 'css/fonts/mingliu-subset.woff2';
const EXPECT = 2333836;
const state = { ua: navigator.userAgent, platform: navigator.platform, dpr: devicePixelRatio, vw: innerWidth, steps: {} };
document.getElementById('ua').textContent =
  'UA: ' + navigator.userAgent + '\nplatform: ' + navigator.platform + ' · dpr: ' + devicePixelRatio + ' · viewport: ' + innerWidth;

const set = (id, html) => { document.getElementById(id).innerHTML = html; };
const okBad = (ok, text) => `<span class="${ok ? 'ok' : 'bad'}">${text}</span>`;
const fmt = (n) => (n == null ? '?' : n.toLocaleString('en-US'));

async function step(name, fn, ms = 90000) {
  const t0 = performance.now();
  try {
    const value = await Promise.race([
      fn(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout ' + ms + 'ms')), ms))
    ]);
    state.steps[name] = { ok: true, ms: Math.round(performance.now() - t0), value };
    return { ok: true, value };
  } catch (e) {
    state.steps[name] = { ok: false, ms: Math.round(performance.now() - t0), error: (e && (e.name + ': ' + e.message)) || String(e) };
    return { ok: false, error: (e && (e.name + ': ' + e.message)) || String(e) };
  }
}

function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

(async () => {
  // ---- NET ----
  const net = await step('net', async () => {
    const r = await fetch(FULL, { cache: 'no-store' });
    const buf = await r.arrayBuffer();
    return { status: r.status, bytes: buf.byteLength, type: r.headers.get('content-type'), len: r.headers.get('content-length') };
  }, 120000);
  if (net.ok) {
    const v = net.value;
    const good = v.bytes === EXPECT;
    set('net', `${okBad(good, good ? '下載完整' : '下載不完整')}\nstatus=${v.status} bytes=${fmt(v.bytes)} / 預期 ${fmt(EXPECT)} · content-type=${esc(v.type)}\n耗時 ${net.ms}ms`);
  } else {
    set('net', okBad(false, '下載失敗') + '\n' + esc(net.error) + `\n耗時 ${net.ms}ms`);
  }

  // ---- DECODE ----
  if (net.ok && net.value.bytes === EXPECT) {
    const buf = await (await fetch(FULL, { cache: 'no-store' })).arrayBuffer();
    const dec = await step('decode', async () => {
      const ff = new FontFace('DBG-BUF', buf);
      await ff.load();
      document.fonts.add(ff);
      return ff.status;
    });
    set('decode', (dec.ok ? okBad(true, 'CoreText 接受這份字體') : okBad(false, 'CoreText 拒絕解碼')) +
      '\n' + (dec.ok ? 'status=' + dec.value : esc(dec.error)) + ` · ${dec.ms}ms`);
  } else {
    state.steps.decode = { skipped: true };
    set('decode', '<span class="warn">略過（下載不完整）</span>');
  }

  // ---- URL ----
  const urlStep = await step('url', async () => {
    const ff = new FontFace('DBG-URL', `url('${FULL}') format('woff2')`);
    await ff.load();
    document.fonts.add(ff);
    return ff.status;
  }, 120000);
  set('url', (urlStep.ok ? okBad(true, 'url() 載入成功') : okBad(false, 'url() 載入失敗')) +
    '\n' + (urlStep.ok ? 'status=' + urlStep.value : esc(urlStep.error)) + ` · ${urlStep.ms}ms`);

  // ---- ladder ----
  const ladder = [
    ['500k', 'css/fonts/fonttest-500k.woff2'],
    ['1000k', 'css/fonts/fonttest-1000k.woff2'],
    ['1500k', 'css/fonts/fonttest-1500k.woff2'],
    ['2000k', 'css/fonts/fonttest-2000k.woff2']
  ];
  for (const [label, href] of ladder) {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="name">${label}</div><div class="res">量測中…</div>
      <div class="sample" style="font-family:'DBG-${label}', sans-serif">一二三 法規</div>`;
    document.getElementById('ladder').appendChild(el);
    const res = document.getElementById('ladder').lastElementChild.querySelector('.res');

    const sizeStep = await step('size-' + label, async () => {
      const r = await fetch(href, { cache: 'no-store' });
      const buf = await r.arrayBuffer();
      return { bytes: buf.byteLength, buf };
    }, 120000);

    if (!sizeStep.ok) { res.innerHTML = okBad(false, '下載失敗') + '\n' + esc(sizeStep.error); continue; }

    const dec = await step('dec-' + label, async () => {
      const ff = new FontFace('DBG-' + label, sizeStep.value.buf);
      await ff.load();
      document.fonts.add(ff);
      return ff.status;
    });
    res.innerHTML = `${fmt(sizeStep.value.bytes)} bytes · ` +
      (dec.ok ? okBad(true, '可用') : okBad(false, '被拒絕')) +
      '\n' + (dec.ok ? 'status=' + dec.value : esc(dec.error)) + ` · ${dec.ms}ms`;
  }

  // ---- site face ----
  const faces = [...document.fonts].filter(f => f.family.replace(/['"]/g, '') === 'MingLiu');
  if (!faces.length) {
    state.steps.site = { declared: false };
    set('site', okBad(false, 'theme.css 中找不到 MingLiu @font-face'));
  } else {
    const ff = faces[0];
    const r = await step('site-load', () => document.fonts.load("16px 'MingLiu'", '法規查詢系統'), 120000);
    state.steps.site = { declared: true, status: ff.status, load: r };
    set('site', (ff.status === 'loaded' && r.ok ? okBad(true, '站上字體可用') : okBad(false, '站上字體不可用')) +
      `\nstatus=${ff.status} · load=${r.ok ? 'ok' : esc(r.error)}`);
  }

  // ---- dump ----
  state.resources = performance.getEntriesByType('resource')
    .filter(e => /woff2|ttf/.test(e.name))
    .map(e => ({ name: e.name.split('/').pop(), transfer: e.transferSize, dur: Math.round(e.duration) }));
  state.fonts = [...document.fonts].map(f => f.family + ':' + f.status);
  document.getElementById('raw').textContent = JSON.stringify(state, null, 1);
  window.__done = true;
})();
</script>
</body>
</html>
