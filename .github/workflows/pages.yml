name: Deploy to GitHub Pages

# 每次推送到 main 自动构建并部署「界面展示版」静态站点。
# 预览地址：https://<owner>.github.io/<repo>/
# 前置条件：Settings → Pages → Build and deployment → Source 必须选「GitHub Actions」，
#          否则 configure-pages 会报 "Get Pages site failed"。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 網頁字體：依站點實際用字重新生成分塊字體（tools/build-fonts.py 會改寫
      # css/theme.css 的 @font-face，所以必須在 export 之前跑）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成網頁字體（子集化 + 分塊）
        run: |
          python -m pip install --quiet "fonttools[woff]"
          python tools/build-fonts.py

      # 导出脚本零依赖（只用 fs/path），不需要 npm install
      # --data=static-data：用仓库内的真实数据快照建站（不带该参数则产出空壳）
      - name: 生成静态站点
        run: node tools/export-static.js --data=static-data

      # Jekyll 会忽略 _ 开头的文件，并把 JS 里的 {{ }} 当 Liquid 解析
      - name: 关闭 Jekyll
        run: touch site/.nojekyll

      # enablement: true —— Pages 配置缺失（GET /pages 404）時由 action 自動啟用。
      # workflow 已聲明 permissions: pages: write，滿足啟用條件。
      # 若仍報 "Resource not accessible by integration"，請手動到
      # Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
